<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#F7F9FA">
<title>GALOLINGO — LES VACANCES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Feather Bold';
    src: url('fonts/Feather-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
    font-display: swap;
  }

  html{
    color-scheme: light only;
  }

  :root{
    color-scheme: light only;
    --rosa: #F2A7AD;
    --laranja-escuro: #EF7211;
    --azul-claro: #C2EDF2;
    --amarelo: #F2A444;
    --laranja-salmao: #F2B28D;
    --vermelho: #D93636;

    --laranja-dark: #C95C08;
    --vermelho-dark: #B02626;
    --azul-dark: #8EC2C9;
    --green-correct: #48B832;
    --green-correct-dark: #379425;
    
    --text: #3C3C3C;
    --text-light: #6b7280;
    --bg: #F7F9FA;
    --card: #FFFFFF;
    --border: #E5E5E5;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
  }

  h1, h2, .level-label, .score-badge, .btn, .chip-num, .chip-pts, .final-score, .fr-sentence, .pt-sentence, .letter-box, .audio-btn {
    font-family: 'Feather Bold', 'Nunito', sans-serif;
  }

  #page{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display:flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(0,0,0,0.06);
  }

  /* TOPBAR */
  #topbar{
    position: sticky;
    top:0;
    z-index: 10;
    background: var(--card);
    border-bottom: 2px solid var(--border);
    padding: 10px 16px 12px;
  }
  .topbar-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap:10px;
    margin-bottom:8px;
  }
  .level-label{
    font-size: 16px;
    color: var(--text);
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
    text-transform: lowercase;
  }
  .score-badge{
    font-size: 15px;
    background: #FFF5EA;
    color: var(--laranja-escuro);
    border: 2px solid var(--amarelo);
    border-radius: 999px;
    padding: 4px 12px;
    white-space: nowrap;
    flex-shrink:0;
  }
  .score-max{ font-weight:600; opacity:.7; font-size:12px; }
  .progress-track{
    background: var(--border);
    border-radius: 999px;
    height: 12px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--amarelo), var(--laranja-escuro));
    border-radius: 999px;
    transition: width .4s ease;
  }

  /* LAYOUT */
  main#content{
    flex:1;
    padding: 20px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  /* REGRA GLOBAL PARA CORES */
  .btn,
  .option-card,
  .chip-option,
  .audio-btn,
  .letter-tile,
  .letter-box.filled,
  .letter-box.correct,
  .letter-box.wrong,
  .blank-filled,
  .blank-correct,
  .blank-wrong,
  .chip-num,
  .option-card.selected,
  .chip-option.selected,
  .option-card.correct,
  .chip-option.correct,
  .option-card.wrong,
  .chip-option.wrong {
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff !important;
  }

  .btn{
    font-size: 18px;
    letter-spacing: .3px;
    text-transform: lowercase;
    border: none;
    border-radius: 16px;
    padding: 15px 20px;
    cursor: pointer;
    color: #ffffff !important;
    background: var(--laranja-escuro);
    box-shadow: 0 5px 0 var(--laranja-dark);
    transition: transform .05s ease, box-shadow .05s ease, opacity .2s ease;
  }
  .btn:active:not(:disabled){ transform: translateY(4px); box-shadow: 0 1px 0 transparent; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-block{ width:100%; margin-top:auto; position: sticky; bottom: 16px; z-index: 5; }

  .footer-space{ flex:1; }

  /* HOME / RESULTADOS */
  .home-card{
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 22px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    animation: popIn .35s ease;
  }
  
  .mascot-img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    margin-bottom: 8px;
  }

  .home-card h1{ font-size: 26px; color: var(--text); text-transform: lowercase; }
  .home-sub{ font-size:15px; color: var(--text-light); margin:0; line-height:1.5; }
  .level-preview{ width:100%; display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .level-chip{
    display:flex; align-items:center; gap:10px;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-weight:700;
    font-size:14px;
    text-align:left;
  }
  .chip-num{
    background: var(--rosa);
    color:#ffffff !important;
    width:28px; height:28px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .chip-pts{ margin-left:auto; color: var(--laranja-escuro); }

  .final-score{
    font-size: 44px;
    color: var(--laranja-escuro);
    margin: 4px 0;
  }
  .final-score span{ font-size:18px; color: var(--text-light); font-weight:700; }
  .breakdown{ width:100%; margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .breakdown-row{
    display:flex; justify-content:space-between;
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-weight:700;
    font-size:14px;
  }

  /* CARDS DE QUESTÕES */
  .question-card{
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px 18px;
    animation: popIn .3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .instruction{
    font-size:13px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-light);
    font-weight:700;
    margin:0 0 12px;
    width: 100%;
    text-align: center;
  }
  .fr-sentence{
    font-size: 19px;
    color: var(--text);
    line-height: 1.6;
    margin: 4px 0 18px;
    width: 100%;
    text-align: center;
  }
  .pt-sentence{
    font-size: 17px;
    color: var(--text);
    line-height: 1.5;
    margin: 0 0 16px;
    background: #F0FAFC;
    border-left: 4px solid var(--azul-dark);
    padding: 12px 14px;
    border-radius: 8px;
    width: 100%;
    text-align: center;
  }

  /* PAINEL DE ÁUDIO */
  .audio-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #FFF8F5;
    border: 2px solid var(--laranja-salmao);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    margin-bottom: 18px;
    width: 100%;
  }
  .audio-btn {
    background: var(--laranja-escuro);
    color: #ffffff !important;
    border: none;
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--laranja-dark);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .audio-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 transparent; }
  .speed-control {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    max-width: 140px;
  }
  .speed-label {
    font-size: 11px;
    font-weight: 800;
    color: var(--text-light);
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }
  .speed-slider {
    width: 100%;
    accent-color: var(--laranja-escuro);
    cursor: pointer;
  }

  /* BOTÕES DE OPÇÃO / TRADUÇÃO */
  .options-grid{ display:flex; flex-direction:column; gap:10px; width: 100%; }
  .option-card{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size: 15px;
    text-align:center;
    background: var(--laranja-escuro);
    border: 2px solid var(--laranja-dark);
    border-bottom-width:4px;
    border-radius: var(--radius-md);
    padding: 13px 16px;
    color: #ffffff !important;
    cursor:pointer;
    transition: all .12s ease;
    width: 100%;
  }
  .option-card:hover:not(:disabled){ background: var(--laranja-dark); }
  .option-card.selected{ border-color: var(--laranja-dark); background: var(--laranja-salmao); color: #ffffff !important; }
  .option-card.correct{ border-color: var(--green-correct-dark); background: var(--green-correct); color: #ffffff !important; }
  .option-card.wrong{ border-color: var(--vermelho-dark); background: var(--vermelho); color: #ffffff !important; }
  .option-card:disabled{ cursor:default; }

  /* LACUNAS */
  .blank{
    display:inline-block;
    min-width: 45px;
    text-align:center;
    padding: 2px 10px;
    margin: 0 2px;
    border-radius: 8px;
    background: #EEE;
    color: var(--text-light);
    font-weight:800;
    border-bottom: 3px solid #CCC;
  }
  .blank-filled{ background: var(--laranja-escuro); color: #ffffff !important; border-bottom-color: var(--laranja-dark); }
  .blank-correct{ background: var(--green-correct); color: #ffffff !important; border-bottom-color: var(--green-correct-dark); }
  .blank-wrong{ background: var(--vermelho); color: #ffffff !important; border-bottom-color: var(--vermelho-dark); }

  .chip-label{
    font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.4px;
    color: var(--text-light); margin: 14px 0 8px;
    width: 100%;
    text-align: left;
  }
  .chip-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; width: 100%; }
  .chip-option{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size: 14px;
    background: var(--laranja-escuro);
    border: 2px solid var(--laranja-dark);
    border-bottom-width:4px;
    border-radius: 999px;
    padding: 9px 16px;
    cursor:pointer;
    color: #ffffff !important;
    transition: all .12s ease;
  }
  .chip-option.selected{ border-color: var(--laranja-dark); background: var(--laranja-salmao); color:#ffffff !important; }
  .chip-option.correct{ border-color: var(--green-correct-dark); background: var(--green-correct); color:#ffffff !important; }
  .chip-option.wrong{ border-color: var(--vermelho-dark); background: var(--vermelho); color:#ffffff !important; }

  /* COMPONENTES DO NÍVEL 3 */
  .word-target-box {
    display: inline-flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 3px;
    background: #F3F4F6;
    border: 2px dashed #D1D5DB;
    padding: 6px 6px;
    border-radius: 12px;
    vertical-align: middle;
    margin: 0 4px;
    max-width: 100%;
  }
  
  .letter-box {
    width: 26px;
    height: 32px;
    background: #E5E7EB;
    border: 2px solid #D1D5DB;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 800;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    transition: all .15s ease;
  }
  .letter-box.filled {
    background: var(--laranja-escuro);
    border-color: var(--laranja-dark);
    color: #ffffff !important;
  }
  .letter-box.correct {
    background: var(--green-correct);
    border-color: var(--green-correct-dark);
    color: #ffffff !important;
  }
  .letter-box.wrong {
    background: var(--vermelho);
    border-color: var(--vermelho-dark);
    color: #ffffff !important;
  }

  .letter-tile {
    font-family: 'Feather Bold', 'Nunito', sans-serif;
    font-size: 15px;
    background: var(--laranja-escuro);
    border: 2px solid var(--laranja-dark);
    border-bottom-width: 4px;
    border-radius: 999px;
    min-width: 34px;
    height: 36px;
    padding: 0 8px;
    cursor: pointer;
    color: #ffffff !important;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .08s ease;
  }
  .letter-tile:active { transform: scale(0.92); }
  .letter-tile.disabled {
    opacity: 0.25;
    cursor: default;
    pointer-events: none;
  }

  .gabarito{
    font-size: 13px;
    color: var(--vermelho-dark);
    background: #FDF0F0;
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    margin: 12px 0 0;
    width: 100%;
    text-align: center;
  }

  @keyframes popIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>

<div id="page">
  <div id="topbar"></div>
  <main id="content"></main>
</div>

/* =========================================================
   ESTADO GLOBAL DO JOGO
   ========================================================= */
const state = {
  screen: 'home',
  level: 1,
  qIndex: 0,
  totalScore: 0,
  levelScores: {1:0, 2:0, 3:0},
  audioSpeed: 0.8,
  currentAudioInstance: null,
  l1: null,
  l2: null,
  l3: null
};

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatScore(n){
  const rounded = Math.round(n*10)/10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

/* =========================================================
   SISTEMA DE ÁUDIO MP3
   ========================================================= */
const SOUND_FILES = {
  click: 'click.mp3',
  ok: 'ok.mp3',
  falha: 'falha.mp3',
  level: 'level.mp3',
  levelfail: 'levelfail.mp3',
  win: 'win01.mp3',
  losing: 'losing.mp3'
};

function playSound(name){
  try{
    const src = SOUND_FILES[name];
    if(!src) return;
    const audio = new Audio(src);
    audio.play().catch(()=>{});
  }catch(e){}
}

function playFrenchAudio(audioPath){
  try {
    if(state.currentAudioInstance){
      state.currentAudioInstance.pause();
      state.currentAudioInstance.currentTime = 0;
    }
    const audio = new Audio(audioPath);
    audio.playbackRate = state.audioSpeed;
    state.currentAudioInstance = audio;
    audio.play().catch(e => console.warn('Erro ao reproduzir o arquivo de áudio:', e));
  } catch(e) {
    console.warn('Erro na execução do áudio:', e);
  }
}

function updateAudioSpeed(val){
  state.audioSpeed = parseFloat(val);
  if(state.currentAudioInstance){
    state.currentAudioInstance.playbackRate = state.audioSpeed;
  }
  const el = document.getElementById('speed-val');
  if(el) el.innerText = state.audioSpeed.toFixed(1) + 'x';
}

function speakFrench(word){
  try{
    if(!('speechSynthesis' in window) || !word) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(word);
    utter.lang = 'fr-FR';
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  }catch(e){}
}

function getCurrentQuestionData(){
  if(state.level===1) return level1Data[state.qIndex];
  if(state.level===2) return level2Data[state.qIndex];
  return level3Data[state.qIndex];
}

/* =========================================================
   NAVEGAÇÃO E REGRAS
   ========================================================= */
function levelMaxPts(lvl){ return lvl===1?20:(lvl===2?35:45); }
function levelPct(lvl){ return (state.levelScores[lvl]/levelMaxPts(lvl))*100; }

function startGame(){
  playSound('click');
  state.screen='game'; state.level=1; state.qIndex=0;
  state.totalScore=0; state.levelScores={1:0,2:0,3:0};
  setupCurrentQuestion();
  render();
}

function setupCurrentQuestion(){
  if(state.currentAudioInstance){
    state.currentAudioInstance.pause();
    state.currentAudioInstance.currentTime = 0;
  }
  if(state.level===1) setupLevel1Question(state.qIndex);
  else if(state.level===2) setupLevel2Question(state.qIndex);
  else setupLevel3Question(state.qIndex);
}

function nextQuestion(){
  playSound('click');
  state.qIndex++;
  if(state.qIndex>=10){
    state.screen='levelComplete';
    playSound(levelPct(state.level)>=70 ? 'level' : 'levelfail');
    render();
    return;
  }
  setupCurrentQuestion();
  render();
}

function startNextLevel(){
  playSound('click');
  state.level++; state.qIndex=0; state.screen='game';
  setupCurrentQuestion();
  render();
}

function goFinal(){
  playSound('click');
  state.screen='final';
  playSound(state.totalScore>=75 ? 'win' : 'losing');
  render();
}

function resetGame(){
  playSound('click');
  state.screen='home'; state.level=1; state.qIndex=0;
  state.totalScore=0; state.levelScores={1:0,2:0,3:0};
  render();
}

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function render(){
  renderTopbar();
  const content = document.getElementById('content');
  if(state.screen==='home'){ content.innerHTML = homeTemplate(); }
  else if(state.screen==='game'){
    if(state.level===1) renderLevel1();
    else if(state.level===2) renderLevel2();
    else renderLevel3();
  }
  else if(state.screen==='levelComplete'){ content.innerHTML = levelCompleteTemplate(); }
  else if(state.screen==='final'){ content.innerHTML = finalTemplate(); }
}

function renderTopbar(){
  const bar = document.getElementById('topbar');
  const scoreTxt = formatScore(state.totalScore);
  let progressPct = 0;
  let levelLabel = 'galolingo';
  if(state.screen==='game'){
    const completed = (state.level-1)*10 + state.qIndex;
    progressPct = Math.round((completed/30)*100);
    levelLabel = `nível ${state.level} · questão ${state.qIndex+1}/10`;
  } else if(state.screen==='levelComplete'){
    progressPct = Math.round((state.level*10/30)*100);
    levelLabel = `nível ${state.level} concluído`;
  } else if(state.screen==='final'){
    progressPct = 100;
    levelLabel = 'jogo concluído';
  } else {
    levelLabel = 'pronto para começar?';
  }
  bar.innerHTML = `
    <div class="topbar-row">
      <span class="level-label">${levelLabel}</span>
      <span class="score-badge">🏆 ${scoreTxt}<span class="score-max">/100</span></span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
  `;
}

function renderAudioControls(audioPath){
  const safeAudio = audioPath
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'");
  return `
    <div class="audio-controls">
      <button class="audio-btn" style="color:#ffffff !important;" onclick="playFrenchAudio('${safeAudio}')">🔊 Ouvir Frase</button>
      <div class="speed-control">
        <div class="speed-label">
          <span>Velocidade</span>
          <span id="speed-val">${state.audioSpeed.toFixed(1)}x</span>
        </div>
        <input type="range" class="speed-slider" min="0.4" max="1.5" step="0.1" value="${state.audioSpeed}" oninput="updateAudioSpeed(this.value)">
      </div>
    </div>
  `;
}

function blankSpanHtml(selIdx, options, correctWord, checked, num){
  if(selIdx===null) return `<span class="blank">___</span>`;
  const word = options[selIdx];
  let cls = 'blank blank-filled';
  if(checked) cls = 'blank ' + (word===correctWord ? 'blank-correct' : 'blank-wrong');
  return `<span class="${cls}" style="color:#ffffff !important;">${word}</span>`;
}

/* =========================================================
   NÍVEL 1 — Tradução Direta
   ========================================================= */
function setupLevel1Question(idx){
  const q = level1Data[idx];
  const opts = shuffle([
    { text:q.correct, correct:true },
    ...q.wrong.map(w=>({ text:w, correct:false }))
  ]);
  state.l1 = { options:opts, selected:null, checked:false };
}

function renderLevel1(){
  const q = level1Data[state.qIndex];
  const s = state.l1;
  const optsHtml = s.options.map((o,i)=>{
    let cls='option-card';
    if(s.checked){
      if(o.correct) cls+=' correct';
      else if(i===s.selected) cls+=' wrong';
    } else if(i===s.selected){ cls+=' selected'; }
    return `<button class="${cls}" style="color:#ffffff !important;" ${s.checked?'disabled':''} onclick="selectL1(${i})">${o.text}</button>`;
  }).join('');

  const btnLabel = s.checked ? 'continuar' : 'verificar';
  const btnDisabled = (!s.checked && s.selected===null);
  const btnOnclick = s.checked ? 'nextQuestion()' : 'checkL1()';

  document.getElementById('content').innerHTML = `
    <div class="question-card">
      <p class="instruction">Traduza a frase</p>
      ${renderAudioControls(q.audio)}
      <p class="fr-sentence">${q.fr}</p>
      <div class="options-grid">${optsHtml}</div>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" style="color:#ffffff !important;" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
  `;
}

function selectL1(i){
  if(state.l1.checked) return;
  playSound('click');
  state.l1.selected = i;
  renderLevel1();
}

function checkL1(){
  const s = state.l1;
  s.checked = true;
  if(s.options[s.selected].correct){
    state.totalScore += 2;
    state.levelScores[1] += 2;
    playSound('ok');
  } else {
    playSound('falha');
  }
  renderLevel1();
  renderTopbar();
}

/* =========================================================
   NÍVEL 2 — Lacunas Duplas + Tradução
   ========================================================= */
function setupLevel2Question(idx){
  const q = level2Data[idx];
  state.l2 = {
    step:'A',
    b1Options: shuffle(q.blank1.options), b1Selected:null,
    b2Options: shuffle(q.blank2.options), b2Selected:null,
    checkedA:false,
    trOptions: shuffle([{text:q.transCorrect,correct:true}, ...q.transWrong.map(w=>({text:w,correct:false}))]),
    trSelected:null, checkedB:false
  };
}

function renderLevel2(){
  const q = level2Data[state.qIndex];
  const s = state.l2;
  const content = document.getElementById('content');

  if(s.step==='A'){
    const span1 = blankSpanHtml(s.b1Selected, s.b1Options, q.blank1.correct, s.checkedA, 1);
    const span2 = blankSpanHtml(s.b2Selected, s.b2Options, q.blank2.correct, s.checkedA, 2);
    const sentence = q.frBlanked.replace('[ 1 ]', span1).replace('[ 2 ]', span2);

    const btns1 = s.b1Options.map((w,i)=>{
      let cls='chip-option';
      if(s.checkedA){ if(w===q.blank1.correct) cls+=' correct'; else if(i===s.b1Selected) cls+=' wrong'; }
      else if(i===s.b1Selected){ cls+=' selected'; }
      return `<button class="${cls}" style="color:#ffffff !important;" ${s.checkedA?'disabled':''} onclick="selectL2Blank(1,${i})">${w}</button>`;
    }).join('');

    const btns2 = s.b2Options.map((w,i)=>{
      let cls='chip-option';
      if(s.checkedA){ if(w===q.blank2.correct) cls+=' correct'; else if(i===s.b2Selected) cls+=' wrong'; }
      else if(i===s.b2Selected){ cls+=' selected'; }
      return `<button class="${cls}" style="color:#ffffff !important;" ${s.checkedA?'disabled':''} onclick="selectL2Blank(2,${i})">${w}</button>`;
    }).join('');

    const btnLabel = s.checkedA ? 'continuar' : 'verificar lacunas';
    const btnOnclick = s.checkedA ? 'advanceL2Step()' : 'checkL2Blanks()';
    const btnDisabled = !s.checkedA && (s.b1Selected===null || s.b2Selected===null);

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Etapa A · Complete as lacunas</p>
        ${renderAudioControls(q.audio)}
        <p class="fr-sentence">${sentence}</p>
        <p class="chip-label">Lacuna 1</p>
        <div class="chip-row">${btns1}</div>
        <p class="chip-label">Lacuna 2</p>
        <div class="chip-row">${btns2}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" style="color:#ffffff !important;" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  } else {
    const trbtns = s.trOptions.map((o,i)=>{
      let cls='option-card';
      if(s.checkedB){ if(o.correct) cls+=' correct'; else if(i===s.trSelected) cls+=' wrong'; }
      else if(i===s.trSelected){ cls+=' selected'; }
      return `<button class="${cls}" style="color:#ffffff !important;" ${s.checkedB?'disabled':''} onclick="selectL2Translation(${i})">${o.text}</button>`;
    }).join('');

    const btnLabel = s.checkedB ? 'próxima questão' : 'verificar tradução';
    const btnOnclick = s.checkedB ? 'nextQuestion()' : 'checkL2Translation()';
    const btnDisabled = !s.checkedB && s.trSelected===null;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Etapa B · Escolha a tradução correta</p>
        ${renderAudioControls(q.audio)}
        <p class="fr-sentence">${q.frFull}</p>
        <div class="options-grid">${trbtns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" style="color:#ffffff !important;" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  }
}

function selectL2Blank(which, i){
  if(state.l2.checkedA) return;
  playSound('click');
  const word = which===1 ? state.l2.b1Options[i] : state.l2.b2Options[i];
  speakFrench(word);
  if(which===1) state.l2.b1Selected=i; else state.l2.b2Selected=i;
  renderLevel2();
}

function checkL2Blanks(){
  const q = level2Data[state.qIndex];
  const s = state.l2;
  s.checkedA = true;
  const b1ok = s.b1Options[s.b1Selected]===q.blank1.correct;
  const b2ok = s.b2Options[s.b2Selected]===q.blank2.correct;
  if(b1ok){ state.totalScore+=1; state.levelScores[2]+=1; }
  if(b2ok){ state.totalScore+=1; state.levelScores[2]+=1; }
  playSound(b1ok && b2ok ? 'ok' : 'falha');
  renderLevel2();
  renderTopbar();
}

function advanceL2Step(){
  playSound('click');
  state.l2.step='B';
  renderLevel2();
}

function selectL2Translation(i){
  if(state.l2.checkedB) return;
  playSound('click');
  state.l2.trSelected = i;
  renderLevel2();
}

function checkL2Translation(){
  const s = state.l2;
  s.checkedB = true;
  if(s.trOptions[s.trSelected].correct){
    state.totalScore+=1.5; state.levelScores[2]+=1.5;
    playSound('ok');
  } else {
    playSound('falha');
  }
  renderLevel2();
  renderTopbar();
}

/* =========================================================
   NÍVEL 3 — Lacunas + Montar Palavra + Traduzir
   ========================================================= */
function setupLevel3Question(idx){
  const q = level3Data[idx];
  const lcOptions = shuffle(q.lcOptions);

  const targetChars = q.montarWord.split('');
  const allChars = shuffle(targetChars);
  const tiles = allChars.map((char, id) => ({ id, char }));

  const trOptions = shuffle([
    { text: q.pt, correct: true },
    ...q.transWrong.map(w => ({ text: w, correct: false }))
  ]);

  state.l3 = {
    step: 'A',
    lcOptions: lcOptions,
    lcSelected: null,
    montarTarget: q.montarWord,
    montarSlots: new Array(q.montarWord.length).fill(null),
    letterTiles: tiles,
    checkedA: false,
    isCorrectLC: false,
    isCorrectMontar: false,
    trOptions: trOptions,
    trSelected: null,
    checkedB: false
  };
}

function renderLevel3(){
  const q = level3Data[state.qIndex];
  const s = state.l3;
  const content = document.getElementById('content');

  if (s.step === 'A') {
    let lcSpanHtml = '';
    if(s.lcSelected === null){
      lcSpanHtml = `<span class="blank">___</span>`;
    } else {
      const word = s.lcOptions[s.lcSelected];
      let cls = 'blank blank-filled';
      if(s.checkedA) cls = 'blank ' + (word === q.lcWord ? 'blank-correct' : 'blank-wrong');
      lcSpanHtml = `<span class="${cls}" style="color:#ffffff !important;">${word}</span>`;
    }

    let montarBoxesHtml = `<span class="word-target-box">`;
    for(let i = 0; i < q.montarWord.length; i++){
      const slot = s.montarSlots[i];
      let char = slot ? slot.char : '';
      let cls = 'letter-box';
      if(slot) cls += ' filled';
      if(s.checkedA){
        cls = 'letter-box ' + (s.montarSlots.map(x=>x?x.char:'').join('') === q.montarWord ? 'correct' : 'wrong');
      }
      const whiteStyle = slot ? ' style="color:#ffffff !important;"' : '';
      montarBoxesHtml += `<span class="${cls}" onclick="removeLetterSlot(${i})"${whiteStyle}>${char}</span>`;
    }
    montarBoxesHtml += `</span>`;

    let sentenceHtml = q.template
      .replace('[LC]', lcSpanHtml)
      .replace('[MONTAR]', montarBoxesHtml);

    const lcBtns = s.lcOptions.map((opt, i) => {
      let cls = 'chip-option';
      if(s.checkedA){
        if(opt === q.lcWord) cls += ' correct';
        else if(i === s.lcSelected) cls += ' wrong';
      } else if(i === s.lcSelected){
        cls += ' selected';
      }
      return `<button class="${cls}" style="color:#ffffff !important;" ${s.checkedA?'disabled':''} onclick="selectL3LCOption(${i})">${opt}</button>`;
    }).join('');

    const letterTilesHtml = s.letterTiles.map((t) => {
      const isUsed = s.montarSlots.some(slot => slot && slot.id === t.id);
      const dis = isUsed || s.checkedA ? 'disabled' : '';
      return `<button class="letter-tile ${dis}" style="color:#ffffff !important;" onclick="addLetterSlot(${t.id})">${t.char}</button>`;
    }).join('');

    const gabaritoHtml = (s.checkedA && (!s.isCorrectLC || !s.isCorrectMontar))
      ? `<div class="gabarito"><strong>Frase Correta:</strong> ${q.frFull}</div>`
      : '';

    const isFilledMontar = s.montarSlots.every(slot => slot !== null);
    const isReady = s.lcSelected !== null && isFilledMontar;

    const btnLabel = s.checkedA ? 'continuar para tradução' : 'verificar lacunas';
    const btnOnclick = s.checkedA ? 'advanceL3Step()' : 'checkL3Blanks()';
    const btnDisabled = !s.checkedA && !isReady;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Preencha as lacunas na frase</p>
        ${renderAudioControls(q.audio)}
        
        <p class="fr-sentence">${sentenceHtml}</p>

        <p class="chip-label">1. Escolha a palavra:</p>
        <div class="chip-row">${lcBtns}</div>

        <p class="chip-label" style="margin-top:10px;">2. Monte a palavra letra por letra:</p>
        <div class="chip-row">${letterTilesHtml}</div>

        ${gabaritoHtml}
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" style="color:#ffffff !important;" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  } else {
    const trbtns = s.trOptions.map((o,i)=>{
      let cls='option-card';
      if(s.checkedB){ if(o.correct) cls+=' correct'; else if(i===s.trSelected) cls+=' wrong'; }
      else if(i===s.trSelected){ cls+=' selected'; }
      return `<button class="${cls}" style="color:#ffffff !important;" ${s.checkedB?'disabled':''} onclick="selectL3Translation(${i})">${o.text}</button>`;
    }).join('');

    const btnLabel = s.checkedB ? 'próxima questão' : 'verificar tradução';
    const btnOnclick = s.checkedB ? 'nextQuestion()' : 'checkL3Translation()';
    const btnDisabled = !s.checkedB && s.trSelected===null;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Escolha a tradução correta</p>
        ${renderAudioControls(q.audio)}
        <p class="fr-sentence">${q.frFull}</p>
        <div class="options-grid">${trbtns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" style="color:#ffffff !important;" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  }
}

function selectL3LCOption(index){
  if(state.l3.checkedA) return;
  playSound('click');
  speakFrench(state.l3.lcOptions[index]);
  state.l3.lcSelected = index;
  renderLevel3();
}

function addLetterSlot(tileId){
  if(state.l3.checkedA) return;
  const emptyIndex = state.l3.montarSlots.findIndex(s => s === null);
  if(emptyIndex !== -1){
    const tile = state.l3.letterTiles.find(t => t.id === tileId);
    playSound('click');
    state.l3.montarSlots[emptyIndex] = tile;
    renderLevel3();
  }
}

function removeLetterSlot(slotIndex){
  if(state.l3.checkedA) return;
  if(state.l3.montarSlots[slotIndex] !== null){
    playSound('click');
    state.l3.montarSlots[slotIndex] = null;
    renderLevel3();
  }
}

function checkL3Blanks(){
  const q = level3Data[state.qIndex];
  const s = state.l3;
  s.checkedA = true;

  const selectedLCWord = s.lcOptions[s.lcSelected];
  s.isCorrectLC = (selectedLCWord === q.lcWord);

  const builtMontarWord = s.montarSlots.map(x => x ? x.char : '').join('');
  s.isCorrectMontar = (builtMontarWord === q.montarWord);

  if(s.isCorrectLC){ state.totalScore += 1.5; state.levelScores[3] += 1.5; }
  if(s.isCorrectMontar){ state.totalScore += 1.5; state.levelScores[3] += 1.5; }

  playSound(s.isCorrectLC && s.isCorrectMontar ? 'ok' : 'falha');
  renderLevel3();
  renderTopbar();
}

function advanceL3Step(){
  playSound('click');
  state.l3.step = 'B';
  renderLevel3();
}

function selectL3Translation(i){
  if(state.l3.checkedB) return;
  playSound('click');
  state.l3.trSelected = i;
  renderLevel3();
}

function checkL3Translation(){
  const s = state.l3;
  s.checkedB = true;
  const isCorrect = s.trOptions[s.trSelected].correct;

  if(isCorrect){
    state.totalScore += 1.5;
    state.levelScores[3] += 1.5;
    playSound('ok');
  } else {
    playSound('falha');
  }
  renderLevel3();
  renderTopbar();
}

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
render();
</script>
</body>
</html>
